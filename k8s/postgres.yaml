apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dungeonrush
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: dungeonrush
            - name: POSTGRES_USER
              value: dr_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: dungeonrush-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dungeonrush
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
