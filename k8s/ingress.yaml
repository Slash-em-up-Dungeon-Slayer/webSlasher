apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dungeonrush-ingress
  namespace: dungeonrush
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: ["your-game-domain.example"]
      secretName: dungeonrush-tls
  rules:
    - host: your-game-domain.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 8080 } }
