apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dungeonrush
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/dungeonrush-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Default
              value: "Host=postgres;Port=5432;Database=dungeonrush;Username=dr_user;Password=$(POSTGRES_PASSWORD)"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: dungeonrush-secrets, key: POSTGRES_PASSWORD }
            - name: Jwt__Key
              valueFrom:
                secretKeyRef: { name: dungeonrush-secrets, key: JWT_KEY }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: dungeonrush
spec:
  selector: { app: api }
  ports:
    - port: 8080
