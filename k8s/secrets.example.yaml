# Пример Secret-манифеста. Реальный файл с настоящими значениями создаётся
# отдельно (kubectl create secret ... или через SealedSecrets/Vault) и НИКОГДА
# не коммитится в git — этот файл только показывает форму.
apiVersion: v1
kind: Secret
metadata:
  name: dungeonrush-secrets
  namespace: dungeonrush
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  JWT_KEY: "REPLACE_ME_MIN_32_CHARS"
