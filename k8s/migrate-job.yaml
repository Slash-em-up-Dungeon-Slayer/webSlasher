# Одноразовый Job для применения EF Core миграций в кластере.
# Запускать вручную после каждого деплоя, где менялась схема БД:
#   kubectl apply -f k8s/migrate-job.yaml
#   kubectl wait --for=condition=complete job/dungeonrush-migrate -n dungeonrush --timeout=120s
#   kubectl logs job/dungeonrush-migrate -n dungeonrush
# Job с одинаковым именем нельзя переприменить, если предыдущий ещё не удалён
# (ttlSecondsAfterFinished ниже подчищает его автоматически через 5 минут).
apiVersion: batch/v1
kind: Job
metadata:
  name: dungeonrush-migrate
  namespace: dungeonrush
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/your-org/dungeonrush-api:latest
          command: ["dotnet", "DungeonRush.Api.dll", "migrate"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Default
              value: "Host=postgres;Port=5432;Database=dungeonrush;Username=dr_user;Password=$(POSTGRES_PASSWORD)"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: dungeonrush-secrets, key: POSTGRES_PASSWORD }
            - name: Jwt__Key
              valueFrom:
                secretKeyRef: { name: dungeonrush-secrets, key: JWT_KEY }
