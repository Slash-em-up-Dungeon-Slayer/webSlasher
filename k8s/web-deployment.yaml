apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dungeonrush
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/dungeonrush-web:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dungeonrush
spec:
  selector: { app: web }
  ports:
    - port: 8080
