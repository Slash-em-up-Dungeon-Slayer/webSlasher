worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Unity WebGL отдаёт .wasm/.data/.js как есть либо предсжатыми (.br/.gz) —
    # добавляем правильные MIME-типы на случай сжатых файлов.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types application/javascript application/wasm application/octet-stream text/html;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ---------- Security-заголовки ----------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Нужны, если билд использует многопоточный WASM (Job System/Burst)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # Если Unity билд сделан с Brotli-компрессией — отдаём .br с верным заголовком
        location ~ \.wasm\.br$ {
            add_header Content-Encoding br;
            default_type application/wasm;
        }
        location ~ \.data\.br$ {
            add_header Content-Encoding br;
            default_type application/octet-stream;
        }
        location ~ \.js\.br$ {
            add_header Content-Encoding br;
            default_type application/javascript;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Reverse proxy на backend API — фронтенд обращается к /api/*,
        # а не напрямую к внутреннему адресу контейнера api.
        location /api/ {
            proxy_pass http://api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
