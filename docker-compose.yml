version: '3.8'

services:
  db:
    image: postgres:16
    container_name: dungeonrush-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: DungeonRush.Api/Dockerfile
    container_name: dungeonrush-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES}
      Cors__AllowedOrigin: ${ALLOWED_ORIGIN}
    ports:
      - "5080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dungeonrush-web
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./web/build:/usr/share/nginx/html:ro
    ports:
      - "8080:8080"

volumes:
  db_data:
